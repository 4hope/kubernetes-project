apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-autoscale
  namespace: selfheal
spec:
  replicas: 2
  minReadySeconds: 2
  selector:
    matchLabels:
      app: demo-autoscale
  template:
    metadata:
      labels:
        app: demo-autoscale
    spec:
      terminationGracePeriodSeconds: 15
      containers:
        - name: web
          image: selfheal-web:v1
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: STARTUP_SECONDS
              value: "8"
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
            periodSeconds: 1
            timeoutSeconds: 1
            failureThreshold: 1
          resources:
            requests:
              cpu: "100m"
              memory: "64Mi"
            limits:
              cpu: "250m"
              memory: "128Mi"
          lifecycle:
            preStop:
              exec:
                command: ["python", "-c", "import time; time.sleep(5)"]
---
apiVersion: v1
kind: Service
metadata:
  name: demo-autoscale
  namespace: selfheal
spec:
  selector:
    app: demo-autoscale
  ports:
    - port: 8080
      targetPort: 8080
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: demo-autoscale
  namespace: selfheal
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: demo-autoscale
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
    scaleDown:
      stabilizationWindowSeconds: 60
