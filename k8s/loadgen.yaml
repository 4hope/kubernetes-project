apiVersion: v1
kind: Pod
metadata:
  name: loadgen
  namespace: selfheal
  labels:
    app: loadgen
spec:
  automountServiceAccountToken: false
  restartPolicy: Never
  containers:
    - name: client
      image: selfheal-web:v1
      imagePullPolicy: Never
      command: ["python", "-c", "import time; time.sleep(86400)"]
      resources:
        requests:
          cpu: "100m"
          memory: "64Mi"
        limits:
          cpu: "500m"
          memory: "128Mi"
      volumeMounts:
        - name: scripts
          mountPath: /scripts
          readOnly: true
  volumes:
    - name: scripts
      configMap:
        name: measurement-scripts
